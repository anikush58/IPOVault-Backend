services:
  postgres:
    image: postgres:16-alpine
    container_name: ipovault-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ipovault
      POSTGRES_PASSWORD: ipovault
      POSTGRES_DB: ipovault
    volumes:
      - ipovault_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipovault -d ipovault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ipovault_postgres_data:
